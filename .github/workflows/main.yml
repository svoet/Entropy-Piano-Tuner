name: CI Build

on:
  push:
    branches: [ master, main, merge-smcoppola ]
  pull_request:
    branches: [ master, main, merge-smcoppola ]

jobs:
  build-desktop:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            qt_arch: linux_gcc_64
          - os: macos-latest
            qt_arch: clang_64
          - os: windows-latest
            qt_arch: win64_msvc2022_64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.1'
          arch: ${{ matrix.qt_arch }}
          modules: 'qtmultimedia'

      - name: Set up MSVC (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev libpulse-dev libasound2-dev libgl1-mesa-dev libxkbcommon-x11-0
        if: matrix.os == 'macos-latest'
        run: |
          cp ./scripts/mac/mac_env.template.sh ./scripts/mac/mac_env.user.sh
          sh ./scripts/mac/macMake.sh -s
      - name: Build
        shell: bash
        if: matrix.os == 'macos-latest'
        run: |
          sh ./scripts/mac/macMake.sh -b
        else:
        run: |
          mkdir build
          cd build
          qmake -r ../entropypianotuner.pro CONFIG+=release
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            nmake
          else
            make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)
          fi